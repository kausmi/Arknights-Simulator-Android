  <script>
    // 壳（Android）调用的两个入口：一条提示、一个授权教程弹层。
    // 包里那套终端风弹层由 /sandbox/js/ui/asset-pack.js 提供；这里先挂占位，
    // 等它加载完再覆盖成真实现 —— 这样壳在任何时刻调都不会报错。
    window.__arksimToast = function (t) {
      var d = document.createElement('div');
      d.className = 'arksim-toast'; d.textContent = t;
      document.body.appendChild(d);
      setTimeout(function () { d.classList.add('is-out'); }, 2600);
      setTimeout(function () { d.remove(); }, 3200);
    };
  </script>
